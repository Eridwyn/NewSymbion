# Configuration Nginx pour Symbion - Reverse Proxy Complet
# Routage de tous les services via port 443
#
# Installation:
#   sudo cp nginx-symbion.conf /etc/nginx/sites-available/symbion
#   sudo ln -s /etc/nginx/sites-available/symbion /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Map directive pour WebSocket (DOIT être au niveau http{} dans nginx.conf)
# Si vous ne pouvez pas modifier nginx.conf, copiez cette section dans /etc/nginx/conf.d/websocket-upgrade.conf
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name symbion.markcha.fr;

    # Certificats SSL (à adapter selon votre setup)
    # Option 1: Let's Encrypt (recommandé en production)
    # ssl_certificate /etc/letsencrypt/live/symbion.markcha.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/symbion.markcha.fr/privkey.pem;

    # Option 2: Certificats mkcert (dev uniquement)
    ssl_certificate /etc/mosquitto/certs/cert-mkcert.pem;
    ssl_certificate_key /etc/mosquitto/certs/key-mkcert.pem;

    # Configuration SSL moderne
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Logs
    access_log /var/log/nginx/symbion-access.log;
    error_log /var/log/nginx/symbion-error.log;

    # ==========================================
    # 0. Bibliothèque publique (lecture seule, /lib)
    # ==========================================
    location /lib {
        alias /var/www/symbion-lib;
        index index.html;
        try_files $uri $uri/ /lib/index.html;

        # Cache assets statiques
        location ~* \.(css|js|png|jpg|svg|ico|woff2)$ {
            expires 1h;
            add_header Cache-Control "public";
        }
    }

    # ==========================================
    # 1. MQTT WebSocket (path /ws/mqtt)
    # ==========================================
    # CRITIQUE: WebSocket nécessite HTTP/1.1, même si le frontend utilise HTTP/2
    location /ws/mqtt {
        proxy_pass http://127.0.0.1:9001/;

        # Force HTTP/1.1 vers upstream (convertit HTTP/2 client → HTTP/1.1 backend)
        proxy_http_version 1.1;

        # Headers WebSocket (utilise la variable $connection_upgrade définie plus haut)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Headers standards
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts étendus pour connexions persistantes MQTT
        proxy_read_timeout 86400s;  # 24 heures
        proxy_send_timeout 86400s;  # 24 heures
        proxy_connect_timeout 75s;

        # Désactiver buffering (streaming temps réel)
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;

        # Logs dédiés pour debug WebSocket
        access_log /var/log/nginx/mqtt-ws-access.log;
        error_log /var/log/nginx/mqtt-ws-error.log;
    }

    # ==========================================
    # 2. API REST Symbion Kernel (path /api)
    # ==========================================
    location /api/ {
        # Proxy vers Kernel HTTPS (port 8443)
        proxy_pass https://127.0.0.1:8443/api/;

        # Désactiver vérification SSL (certificat self-signed local)
        proxy_ssl_verify off;

        # Headers standards
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Passer les headers d'auth
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Api-Key $http_x_api_key;
        proxy_set_header X-Csrf-Token $http_x_csrf_token;

        # Timeouts standards API
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        # Support streaming responses (notes list)
        proxy_buffering off;
    }

    # ==========================================
    # 3. API v1 Direct (sans préfixe /api)
    # ==========================================
    # Routes API v1 accessibles directement (pour compatibilité frontend)
    location ~ ^/v1/ {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;

        # Headers standards
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Passer les headers d'auth
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Api-Key $http_x_api_key;
        proxy_set_header X-Csrf-Token $http_x_csrf_token;

        # Timeouts standards API
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;

        # Support streaming responses
        proxy_buffering off;
    }

    # ==========================================
    # 4. Health Check Kernel (path /health, /system/health)
    # ==========================================
    location ~ ^/(health|system/health)$ {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Timeout court pour health check
        proxy_read_timeout 5s;
        proxy_connect_timeout 3s;
    }

    # ==========================================
    # 5. WebSocket Notes Stream
    # ==========================================
    location /ws/notes/stream {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ==========================================
    # 6. Auth Routes (/auth/*)
    # ==========================================
    location /auth/ {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Api-Key $http_x_api_key;
        proxy_set_header X-Csrf-Token $http_x_csrf_token;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ==========================================
    # 7. API Routes additionnelles (context, agents, plugins)
    # ==========================================
    location ~ ^/(context|agents|plugins)(/|$) {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Api-Key $http_x_api_key;
        proxy_set_header X-Csrf-Token $http_x_csrf_token;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ==========================================
    # 8. PWA Dashboard (root / et assets)
    # ==========================================
    location / {
        # Proxy vers Vite dev server HTTPS (port 3000)
        # En production, remplacer par root /path/to/dist et try_files
        proxy_pass https://127.0.0.1:3000;

        # Désactiver vérification SSL (certificat self-signed local)
        proxy_ssl_verify off;

        # Headers standards
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support Vite HMR (Hot Module Replacement) WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts standards
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ==========================================
    # Production PWA (commenté, à activer après build)
    # ==========================================
    # location / {
    #     root /home/eridwyn/RustroverProjects/NewSymbion/pwa-dashboard/dist;
    #     try_files $uri $uri/ /index.html;
    #
    #     # Cache assets statiques
    #     location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    #         expires 1y;
    #         add_header Cache-Control "public, immutable";
    #     }
    # }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name symbion.markcha.fr;

    return 301 https://$server_name$request_uri;
}
