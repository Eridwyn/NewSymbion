name: Build and Deploy Symbion Kernel

on:
  push:
    tags:
      - 'kernel-v*'
    branches:
      - master
    paths:
      - 'symbion-kernel/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., kernel-v1.0.0)'
        required: true
        default: 'kernel-v1.0.0'

jobs:
  build:
    # Kernel is a Linux systemd service — no Windows/macOS targets
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev

    - name: Run tests
      run: |
        cargo test -p symbion-kernel

    - name: Build kernel binary
      run: |
        cargo build --release -p symbion-kernel

    - name: Prepare binary with version
      run: |
        mkdir -p artifacts
        VERSION="${{ github.ref_name }}"
        if [ -z "$VERSION" ] || [ "$VERSION" = "master" ]; then
          VERSION="dev-$(git rev-parse --short HEAD)"
        fi
        cp target/release/symbion-kernel "artifacts/symbion-kernel-linux-x64-${VERSION}"
        cp target/release/symbion-kernel "artifacts/symbion-kernel-linux-x64-latest"
        chmod +x artifacts/*

    - name: Generate checksums
      run: |
        cd artifacts
        sha256sum * > checksums.sha256
        ls -la

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: symbion-kernel-linux-x64
        path: artifacts/
        retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/kernel-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find artifacts/ -type f -exec cp {} release-assets/ \;
        ls -la release-assets/

    - name: Get version
      id: get_version
      run: |
        VERSION="${GITHUB_REF#refs/tags/}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Symbion Kernel ${{ steps.get_version.outputs.version }}
        body: |
          # Symbion Kernel ${{ steps.get_version.outputs.version }}

          ## 🧠 Core Features
          - ✅ MQTT Event Bus for distributed agents
          - ✅ HTTPS REST API with JWT authentication
          - ✅ Plugin system (hot-reload capable)
          - ✅ Context engine (Cravate/Intime/Neutre modes)
          - ✅ Agent monitoring with auto-recovery
          - ✅ Health tracking and telemetry

          ## 📥 Installation

          ### Automated Deployment
          ```bash
          curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/deploy-kernel.sh | bash -s ${{ steps.get_version.outputs.version }}
          ```

          ### Manual Installation
          ```bash
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/symbion-kernel-linux-x64-${{ steps.get_version.outputs.version }}
          chmod +x symbion-kernel-linux-x64-${{ steps.get_version.outputs.version }}
          sudo cp symbion-kernel-linux-x64-${{ steps.get_version.outputs.version }} /opt/symbion/symbion-kernel
          sudo systemctl restart symbion-kernel
          ```

          ## ✅ Verification
          ```bash
          sha256sum -c checksums.sha256
          ```

          ## 🔄 Rollback
          ```bash
          sudo systemctl stop symbion-kernel
          sudo cp /opt/symbion/symbion-kernel.backup /opt/symbion/symbion-kernel
          sudo systemctl start symbion-kernel
          ```

        files: release-assets/*
        draft: false
        prerelease: false
        generate_release_notes: true
