name: Build and Deploy PWA Dashboard

on:
  push:
    tags:
      - 'dashboard-v*'
    branches:
      - master
    paths:
      - 'pwa-dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., dashboard-v1.0.0)'
        required: true
        default: 'dashboard-v1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: pwa-dashboard/package-lock.json

    - name: Install dependencies
      run: |
        cd pwa-dashboard
        npm ci

    - name: Build PWA
      run: |
        cd pwa-dashboard
        npm run build
      env:
        VITE_SYMBION_API_KEY: ${{ secrets.SYMBION_API_KEY || 's3cr3t-42' }}

    - name: Prepare artifacts with version
      run: |
        mkdir -p artifacts
        VERSION="${{ github.ref_name }}"
        if [ -z "$VERSION" ] || [ "$VERSION" = "master" ]; then
          VERSION="dev-$(git rev-parse --short HEAD)"
        fi

        # Créer archive avec version
        cd pwa-dashboard/dist
        tar -czf "../../artifacts/symbion-dashboard-${VERSION}.tar.gz" .
        cd ../..

        # Copie pour "latest"
        cp "artifacts/symbion-dashboard-${VERSION}.tar.gz" "artifacts/symbion-dashboard-latest.tar.gz"

    - name: Generate checksums
      run: |
        cd artifacts
        sha256sum * > checksums.sha256
        ls -la

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: symbion-dashboard-build
        path: artifacts/
        retention-days: 90

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/dashboard-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find artifacts/ -type f -exec cp {} release-assets/ \;
        ls -la release-assets/

    - name: Get version
      id: get_version
      run: |
        VERSION="${GITHUB_REF#refs/tags/}"
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        name: Symbion Dashboard ${{ steps.get_version.outputs.version }}
        body: |
          # Symbion PWA Dashboard ${{ steps.get_version.outputs.version }}

          ## 📱 Features
          - ✅ PWA installable sur mobile/desktop
          - ✅ Interface responsive adaptative
          - ✅ Widgets contextuels (Cravate/Intime/Neutre)
          - ✅ Contrôles domestiques temps réel
          - ✅ Monitoring agents et système
          - ✅ Notes intelligentes avec markdown
          - ✅ Navigation mobile fixe optimisée
          - ✅ Mode offline avec service worker

          ## 📥 Installation

          ### Déploiement Automatisé (Recommandé)
          ```bash
          curl -sSL https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/deploy-dashboard.sh | bash -s ${{ steps.get_version.outputs.version }}
          ```

          ### Installation Manuelle
          ```bash
          # Télécharger et extraire
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/symbion-dashboard-${{ steps.get_version.outputs.version }}.tar.gz

          # Déployer dans répertoire web
          sudo mkdir -p /var/www/symbion-dashboard
          sudo tar -xzf symbion-dashboard-${{ steps.get_version.outputs.version }}.tar.gz -C /var/www/symbion-dashboard

          # Servir avec nginx/apache ou http.server
          cd /var/www/symbion-dashboard
          python3 -m http.server 3000
          ```

          ## ✅ Verification
          ```bash
          sha256sum -c checksums.sha256
          ```

          ## 🔄 Configuration
          Le dashboard se connecte automatiquement au kernel via:
          - **Production**: `https://votre-ip:8443` (configuré dans src/config.js)
          - **Dev**: Proxy Vite vers `https://localhost:8443`

          Assurez-vous que le certificat CA est installé pour HTTPS.

        files: release-assets/*
        draft: false
        prerelease: false
        generate_release_notes: true
