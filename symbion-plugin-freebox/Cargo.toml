[package]
name = "symbion-plugin-freebox"
version = "0.1.0"
edition = "2021"
authors = ["Mark Chavatte <Markchavatte@gmail.com>"]
description = "Symbion plugin for Freebox integration - presence detection, network monitoring"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# MQTT
rumqttc = "0.24"

# HTTP server (health endpoint)
axum = "0.7"
tower = "0.4"

# Symbion common plugin utilities
symbion-plugin-common = { path = "../symbion-plugin-common" }

# Crypto (HMAC-SHA1 for Freebox auth)
hmac = "0.12"
sha1 = "0.10"
hex = "0.4"

# Config
toml = "0.8"

# Time
chrono = { version = "0.4.41", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

