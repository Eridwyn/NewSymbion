[package]
name = "symbion-kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.4", features = ["ws", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
futures = "0.3"
bcrypt = "0.17.1"
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.1.0", features = ["aws_lc_rs"] }
parking_lot = "0.12.4"
rumqttc = "0.24.0"
rustls = { version = "0.23", features = ["ring"], default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
toml = "0.8"
shell-words = "1.1.0"
thiserror = "2.0.16"
time = { version = "0.3.41", features = ["macros", "formatting", "serde"] }
time-tz = { version = "2.0", features = ["db"] }
chrono = { version = "0.4", features = ["serde"] }  # F1: Environment module DateTime
bytes = "1"
tokio = { version = "1.47.1", features = ["full"] }
tokio-rustls = { version = "0.26", features = ["ring"] }
tower-http = { version = "0.6", features = ["cors", "timeout"] }
uuid = { version = "1.11.0", features = ["v4"] }

# PR2: MFA + CSRF + Rate Limiting
totp-rs = "5.6"           # TOTP 2FA (RFC 6238)
qrcode = "0.14"           # QR code generation for MFA setup
base32 = "0.5"            # Base32 encoding for TOTP secrets
base64 = "0.22"           # Base64 encoding for data URIs
rand = "0.8"              # Random generation for backup codes
sha2 = "0.10"             # SHA-256 hashing for device fingerprinting
tower = { version = "0.5.2", features = ["full"] }

# PR3: WebAuthn Biometric Authentication
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
webauthn-rs-proto = "0.5"  # Protocol types for WebAuthn

# F4: Notifications (Firebase FCM + SMTP)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Cross-platform: vendor OpenSSL for webauthn-rs attestation (avoids system OpenSSL on Windows CI)
openssl = { version = "0.10", features = ["vendored"] }

# Dynamic Plugin Routing (Unix Socket Reverse Proxy)
hyper = "1.0"
async-trait = "0.1"  # Async trait support for automations executors
hyper-util = { version = "0.1", features = ["tokio", "client", "client-legacy", "http1"] }
http-body-util = "0.1"

# K8: OpenAPI/Swagger Documentation
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "time"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# Sprint 7: SQLite persistence (Phase 1 - sensor environments + automation history)
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

[dev-dependencies]
tempfile = "3.8"  # Temporary files for sensor registry tests
