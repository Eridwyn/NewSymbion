# NewSymbion Workspace - Architecture distribuée avec agents système
# 
# COMPOSANTS :
# - symbion-kernel : Serveur central (API REST + Event Bus MQTT + Plugin Manager)
# - symbion-agent-host : Agent multi-OS complet (monitoring + contrôle système + auto-update)  
# - symbion-plugin-notes : Plugin notes distribuées via MQTT (CRUD complet)
#
# FONCTIONNALITÉS v1.0.2+ :
# - ✅ Interactive CLI setup wizard (first-time configuration)
# - ✅ Cross-platform auto-update system (GitHub releases)  
# - ✅ Advanced system monitoring (CPU, RAM, processes, services)
# - ✅ Remote system control (shutdown, reboot, hibernate, process kill)
# - ✅ MQTT-based command/response architecture
# - ✅ PWA Dashboard temps réel avec widgets dynamiques
#
# UTILISATION :
# cargo build --workspace       # Build tous les composants  
# cargo test --workspace        # Tests de tous les modules
# cargo run -p symbion-kernel   # Lancer le kernel principal

[workspace]
members = ["symbion-kernel","symbion-plugin-notes","symbion-plugin-sensors","symbion-plugin-common","symbion-plugin-freebox","symbion-plugin-ssl","symbion-plugin-library","symbion-plugin-telegram","symbion-agent-host"]
exclude = ["test-*"]  # Exclure tests temporaires
resolver = "2"        # Resolver moderne pour édition 2021
