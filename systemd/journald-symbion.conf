# Symbion Kernel — journald log rotation configuration
#
# Installer :
#   sudo cp systemd/journald-symbion.conf /etc/systemd/journald.conf.d/symbion.conf
#   sudo systemctl restart systemd-journald
#
# Vérifier :
#   journalctl --disk-usage
#   journalctl -u symbion-kernel --since "7 days ago" --no-pager | wc -l
#
# Consulter les logs :
#   journalctl -u symbion-kernel -f            # temps réel
#   journalctl -u symbion-kernel -n 200        # dernières 200 lignes
#   journalctl -u symbion-kernel --since today  # aujourd'hui

[Journal]
# Taille max du journal sur disque (global)
SystemMaxUse=500M

# Taille max par fichier journal
SystemMaxFileSize=50M

# Rétention : 30 jours maximum
MaxRetentionSec=30day

# Compression automatique des anciens journaux
Compress=yes

# Taux max d'écriture (protection contre log spam)
RateLimitIntervalSec=30s
RateLimitBurst=1000
