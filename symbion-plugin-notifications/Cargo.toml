[package]
name = "symbion-plugin-notifications"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
rumqttc = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["serde", "macros"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
dotenvy = "0.15"
axum = "0.7"
symbion-plugin-common = { path = "../symbion-plugin-common" }
