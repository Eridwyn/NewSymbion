# Configuration Nginx pour MQTT WebSocket Dédié
# Server block SANS HTTP/2 pour compatibilité WebSocket
#
# Installation:
#   sudo cp nginx-symbion-mqtt-dedicated.conf /etc/nginx/sites-available/symbion-mqtt
#   sudo ln -s /etc/nginx/sites-available/symbion-mqtt /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Accès: wss://symbion.markcha.fr:8444/

server {
    # CRITIQUE: SANS "http2" pour compatibilité WebSocket
    listen 8444 ssl;
    server_name symbion.markcha.fr;

    # Certificats SSL (identiques au serveur principal)
    # Option 1: Let's Encrypt (production)
    # ssl_certificate /etc/letsencrypt/live/symbion.markcha.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/symbion.markcha.fr/privkey.pem;

    # Option 2: Certificats mkcert (dev)
    ssl_certificate /etc/mosquitto/certs/cert-mkcert.pem;
    ssl_certificate_key /etc/mosquitto/certs/key-mkcert.pem;

    # Configuration SSL moderne
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Logs dédiés
    access_log /var/log/nginx/mqtt-ws-access.log;
    error_log /var/log/nginx/mqtt-ws-error.log;

    # Proxy WebSocket vers Mosquitto
    location / {
        proxy_pass http://127.0.0.1:9001/;

        # Force HTTP/1.1 (requis pour WebSocket)
        proxy_http_version 1.1;

        # Headers WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Headers standards
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts étendus pour connexions persistantes MQTT
        proxy_read_timeout 86400s;  # 24 heures
        proxy_send_timeout 86400s;  # 24 heures
        proxy_connect_timeout 75s;

        # Désactiver buffering (streaming temps réel)
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }
}
