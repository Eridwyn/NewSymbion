[package]
name = "symbion-plugin-telegram"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "symbion-plugin-telegram"
path = "src/main.rs"

[dependencies]
# Symbion ecosystem
symbion-plugin-common = { path = "../symbion-plugin-common" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"

# HTTP server (Unix socket)
axum = { version = "0.7", features = ["macros"] }

# Telegram Bot API
teloxide = { version = "0.13", features = ["macros"] }

# MQTT
rumqttc = "0.24.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utils
uuid = { version = "1.0", features = ["v4", "serde"] }
time = { version = "0.3.41", features = ["serde", "formatting", "parsing"] }
thiserror = "2.0"
dashmap = "6"
reqwest = { version = "0.12", features = ["json", "native-tls"] }

[dev-dependencies]
tempfile = "3"
