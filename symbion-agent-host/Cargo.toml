[package]
name = "symbion-agent-host"
version = "2.5.3"
edition = "2021"
description = "Multi-OS system agent for Symbion network control"
authors = ["Symbion Team"]

[[bin]]
name = "symbion-agent-host"
path = "src/main.rs"

[dependencies]
# MQTT Communication - aligned with kernel version
rumqttc = "0.24.0"
tokio = { version = "1.0", features = ["full"] }

# JSON & Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }

# System Info & Metrics
sysinfo = "0.30"
nix = "0.27"  # Unix system calls (Linux/macOS)
hostname = "0.4"  # Cross-platform hostname detection

# Network Discovery
if-addrs = "0.10"  # Network interface enumeration
mac_address = "1.1"  # MAC address detection

# Error Handling & Logging
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Local API server and notifications
warp = "0.3"
notify-rust = { version = "4.11", optional = true }

# Windows GUI - System tray + Native UI
tray-icon = { version = "0.18", optional = true }
tao = { version = "0.30", optional = true }
wry = { version = "0.47", optional = true }
image = { version = "0.25", optional = true }

# Process management (cross-platform)
process_control = "4.0"  # Cross-platform process execution with timeout
self_update = "0.42.0"
reqwest = "0.12.23"
keyring = "3.6.3"
rpassword = "7.3"
zeroize = "1.7"
toml = "0.8"
dirs = "5.0"
base64 = "0.22"
sha2 = "0.10"


[target.'cfg(target_os = "linux")'.dependencies]
# Linux-specific system control - systemd integration is optional
# systemd = "0.10"  # systemctl integration (disabled due to libsystemd dependency)

[target.'cfg(target_os = "windows")'.dependencies]
# Windows-specific dependencies
winapi = { version = "0.3", features = [
    "winuser", "processthreadsapi", "handleapi", "winnt", "winsvc"
]}
windows-service = "0.6"  # Windows service management
self-replace = "1.3"  # Safe executable replacement for auto-update

[target.'cfg(target_os = "android")'.dependencies]
# Android-specific (Termux environment)
# Uses standard Unix calls through nix crate

[features]
# Default features: GUI enabled by default
# NOTE: On Linux headless/terminal environments, GUI will auto-fallback to terminal mode
#       To permanently disable GUI, compile with: cargo build --release --no-default-features
default = ["gui", "notifications"]
# Feature flags for different capabilities
power-management = []
service-control = []
advanced-metrics = []
# Local API and notifications
local-api = []
notifications = ["notify-rust"]
# GUI with system tray and embedded webview
# Requires graphical environment (DISPLAY/WAYLAND_DISPLAY on Linux)
gui = ["tray-icon", "tao", "wry", "image"]
