    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        ::-webkit-scrollbar { display: none; }

        /* ── Theme Variables ── */
        :root {
            --bg-app: #0a0a0b;
            --bg-header: rgba(19, 20, 26, 0.95);
            --bg-titlebar: rgba(14, 14, 19, 0.95);
            --bg-panel: rgba(10, 10, 11, 0.5);
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-tab: rgba(19, 20, 26, 0.98);
            --border-color: rgba(255, 255, 255, 0.06);
            --border-subtle: rgba(255, 255, 255, 0.04);
            --text-primary: #f8f9fa;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --text-dim: #475569;
            --accent: #cba6f7;
            --accent-secondary: #9d7cd8;
            --accent-glow: rgba(203, 166, 247, 0.06);
            --accent-glow-strong: rgba(203, 166, 247, 0.1);
            --accent-border: rgba(203, 166, 247, 0.2);
            --accent-shadow: rgba(203, 166, 247, 0.3);
            --btn-primary-text: #0a0a0b;
            --btn-ghost-bg: rgba(255, 255, 255, 0.05);
            --btn-ghost-border: rgba(255, 255, 255, 0.1);
            --btn-ghost-hover: rgba(255, 255, 255, 0.08);
            --status-online: #a6e3a1;
            --status-offline: #f38ba8;
            --bar-cpu: #89b4fa;
            --bar-mem: #a6e3a1;
            --bar-disk: #f9e2af;
            --bar-swap: #cba6f7;
            --bar-warn: #fab387;
            --bar-crit: #f38ba8;
            --log-warn: #f9e2af;
            --log-error: #f38ba8;
        }
        [data-theme="light"] {
            --bg-app: #f5f5f7;
            --bg-header: rgba(255, 255, 255, 0.95);
            --bg-titlebar: rgba(245, 245, 247, 0.95);
            --bg-panel: rgba(245, 245, 247, 0.5);
            --bg-card: rgba(0, 0, 0, 0.03);
            --bg-tab: rgba(245, 245, 247, 0.98);
            --border-color: rgba(0, 0, 0, 0.1);
            --border-subtle: rgba(0, 0, 0, 0.05);
            --text-primary: #111827;
            --text-secondary: #374151;
            --text-muted: #6b7280;
            --text-dim: #9ca3af;
            --accent: #9333ea;
            --accent-secondary: #7c3aed;
            --accent-glow: rgba(147, 51, 234, 0.06);
            --accent-glow-strong: rgba(147, 51, 234, 0.1);
            --accent-border: rgba(147, 51, 234, 0.2);
            --accent-shadow: rgba(147, 51, 234, 0.2);
            --btn-primary-text: #ffffff;
            --btn-ghost-bg: rgba(0, 0, 0, 0.04);
            --btn-ghost-border: rgba(0, 0, 0, 0.12);
            --btn-ghost-hover: rgba(0, 0, 0, 0.06);
            --status-online: #16a34a;
            --status-offline: #dc2626;
            --bar-cpu: #3b82f6;
            --bar-mem: #22c55e;
            --bar-disk: #eab308;
            --bar-swap: #9333ea;
            --bar-warn: #f97316;
            --bar-crit: #ef4444;
            --log-warn: #ca8a04;
            --log-error: #dc2626;
        }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
            background: transparent;
            color: var(--text-primary);
            height: 100%;
            overflow: hidden;
            scrollbar-width: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-app);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        0 0 0 1px var(--border-subtle);
            position: relative;
        }

        /* ── Bioluminescent ambient glow ── */
        .app::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            border-radius: 10px;
            background:
                radial-gradient(400px 300px at 10% 0%, var(--accent-glow), transparent 60%),
                radial-gradient(300px 250px at 90% 100%, var(--accent-glow), transparent 50%);
            animation: ambientBreathe 10s ease-in-out infinite;
        }
        @keyframes ambientBreathe { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .app > * { position: relative; z-index: 1; }

        /* ── Resize Handles ── */
        .resize-handle { position: fixed; z-index: 9999; }
        .resize-n { top: 0; left: 8px; right: 8px; height: 4px; cursor: n-resize; }
        .resize-s { bottom: 0; left: 8px; right: 8px; height: 4px; cursor: s-resize; }
        .resize-e { right: 0; top: 8px; bottom: 8px; width: 4px; cursor: e-resize; }
        .resize-w { left: 0; top: 8px; bottom: 8px; width: 4px; cursor: w-resize; }
        .resize-ne { top: 0; right: 0; width: 8px; height: 8px; cursor: ne-resize; }
        .resize-nw { top: 0; left: 0; width: 8px; height: 8px; cursor: nw-resize; }
        .resize-se { bottom: 0; right: 0; width: 8px; height: 8px; cursor: se-resize; }
        .resize-sw { bottom: 0; left: 0; width: 8px; height: 8px; cursor: sw-resize; }

        /* ── Custom Window Title Bar ── */
        .window-titlebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 32px;
            padding: 0 4px 0 12px;
            background: var(--bg-titlebar);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .titlebar-icon {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            flex-shrink: 0;
            object-fit: contain;
        }
        .titlebar-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 0.02em;
        }
        .titlebar-controls {
            display: flex;
            align-items: center;
            gap: 0;
        }
        .titlebar-btn {
            width: 36px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            padding: 0;
            font-size: 0;
        }
        .titlebar-btn:hover {
            background: var(--btn-ghost-hover);
            color: var(--text-primary);
        }
        .titlebar-btn.close:hover {
            background: #e81123;
            color: #fff;
        }
        .titlebar-btn svg { pointer-events: none; }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--bg-header);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-logo {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-secondary) 50%, var(--accent) 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 6s ease infinite;
            filter: drop-shadow(0 0 12px var(--accent-shadow));
        }
        @keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        .header-icon {
            width: 24px;
            height: 24px;
            vertical-align: middle;
            object-fit: contain;
        }
        .header-host {
            font-size: 12px;
            color: var(--text-muted);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 10px;
            background: var(--btn-ghost-bg);
            border: 1px solid var(--border-color);
        }
        .status-badge.online { color: var(--status-online); }
        .status-badge.offline { color: var(--status-offline); }
        .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
        .dot.pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        /* ── Tabs ── */
        .tabs {
            display: flex;
            background: var(--bg-tab);
            border-bottom: 1px solid var(--border-color);
        }
        .tab {
            flex: 1;
            padding: 8px 0;
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: color .15s, border-color .15s;
        }
        .tab:hover { color: var(--text-secondary); }
        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* ── Panel ── */
        .panels {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
            background: var(--bg-panel);
        }
        .panel { display: none; padding: 14px 16px; }
        .panel.active { display: block; }

        /* ── Section Titles ── */
        .section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .6px;
            color: var(--text-muted);
            margin-bottom: 8px;
            margin-top: 14px;
        }
        .section-title:first-child { margin-top: 0; }

        /* ── Metrics ── */
        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }
        .metric-label {
            font-size: 13px;
            color: var(--text-secondary);
        }
        .metric-value {
            font-size: 13px;
            font-weight: 600;
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            color: var(--text-primary);
        }

        /* ── Progress Bars ── */
        .bar-container { margin: 4px 0 8px; }
        .bar-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .bar-header .label { color: var(--text-secondary); }
        .bar-header .value { color: var(--text-primary); font-family: 'SF Mono', monospace; font-weight: 600; }
        .bar-track {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width .5s ease;
        }
        .bar-fill.cpu { background: var(--bar-cpu); box-shadow: 0 0 8px color-mix(in srgb, var(--bar-cpu) 30%, transparent); }
        .bar-fill.mem { background: var(--bar-mem); box-shadow: 0 0 8px color-mix(in srgb, var(--bar-mem) 30%, transparent); }
        .bar-fill.disk { background: var(--bar-disk); box-shadow: 0 0 8px color-mix(in srgb, var(--bar-disk) 30%, transparent); }
        .bar-fill.swap { background: var(--bar-swap); box-shadow: 0 0 8px color-mix(in srgb, var(--bar-swap) 30%, transparent); }
        .bar-fill.warn { background: var(--bar-warn); box-shadow: 0 0 8px color-mix(in srgb, var(--bar-warn) 30%, transparent); }
        .bar-fill.crit { background: var(--bar-crit); box-shadow: 0 0 8px color-mix(in srgb, var(--bar-crit) 30%, transparent); }

        /* ── Info Grid ── */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        .info-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .info-card .card-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: .5px;
        }
        .info-card .card-value {
            font-size: 14px;
            font-weight: 600;
            margin-top: 2px;
            font-family: 'SF Mono', monospace;
            color: var(--text-primary);
        }

        /* ── Agent Cards ── */
        .agent-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .agent-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .agent-name {
            font-weight: 600;
            font-size: 13px;
        }
        .agent-status {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 8px;
        }
        .agent-status.online { background: color-mix(in srgb, var(--status-online) 10%, transparent); color: var(--status-online); border: 1px solid color-mix(in srgb, var(--status-online) 15%, transparent); }
        .agent-status.offline { background: color-mix(in srgb, var(--status-offline) 10%, transparent); color: var(--status-offline); border: 1px solid color-mix(in srgb, var(--status-offline) 15%, transparent); }
        .agent-detail {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ── Logs ── */
        .log-controls {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        .log-filter {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 10px;
            border: 1px solid var(--btn-ghost-border);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: background .15s, color .15s, border-color .15s;
        }
        .log-filter:hover {
            background: var(--btn-ghost-bg);
            color: var(--text-secondary);
        }
        .log-filter.active {
            background: var(--accent-glow-strong);
            color: var(--accent);
            border-color: var(--accent-border);
        }
        .log-list {
            font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            font-size: 11px;
            line-height: 1.6;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            scrollbar-width: none;
        }
        .log-entry {
            padding: 2px 0;
            display: flex;
            gap: 6px;
        }
        .log-time { color: var(--text-dim); min-width: 65px; }
        .log-level { min-width: 40px; font-weight: 600; }
        .log-level.INFO { color: var(--text-muted); }
        .log-level.WARN { color: var(--log-warn); }
        .log-level.ERROR { color: var(--log-error); }
        .log-level.DEBUG { color: var(--text-dim); }
        .log-msg { color: var(--text-secondary); word-break: break-all; }

        /* ── Config Panel ── */
        .config-group {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .config-group-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
        }
        .config-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 12px;
        }
        .config-key { color: var(--text-muted); }
        .config-val { color: var(--text-primary); font-family: 'SF Mono', monospace; }

        /* ── Theme Toggle ── */
        .theme-toggle {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--btn-ghost-bg);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background .15s, color .15s;
            padding: 0;
        }
        .theme-toggle:hover {
            background: var(--btn-ghost-hover);
            color: var(--text-primary);
        }

        /* ── Buttons ── */
        .btn {
            padding: 7px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            transition: opacity .15s, box-shadow .15s;
            color: var(--text-primary);
        }
        .btn:hover { opacity: .85; }
        .btn:active { opacity: .7; }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-secondary));
            color: var(--btn-primary-text);
            box-shadow: 0 0 15px var(--accent-border);
        }
        .btn-primary:hover { box-shadow: 0 0 20px var(--accent-shadow); }
        .btn-ghost {
            background: var(--btn-ghost-bg);
            border: 1px solid var(--btn-ghost-border);
        }
        .btn-ghost:hover { background: var(--btn-ghost-hover); }
        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        /* ── Update Banner ── */
        .update-banner {
            background: var(--accent-glow);
            border: 1px solid color-mix(in srgb, var(--accent) 15%, transparent);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .update-banner strong { color: var(--accent); }

        /* ── Error & Loading States ── */
        .error-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .error-state .icon { font-size: 32px; margin-bottom: 12px; }
        .error-state .msg { font-size: 13px; margin-bottom: 16px; }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ── Footer ── */
        .footer {
            padding: 6px 16px;
            text-align: center;
            font-size: 10px;
            color: var(--text-dim);
            background: var(--bg-header);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
<div class="app">
    <!-- Resize Handles -->
    <div class="resize-handle resize-n" data-dir="North"></div>
    <div class="resize-handle resize-s" data-dir="South"></div>
    <div class="resize-handle resize-e" data-dir="East"></div>
    <div class="resize-handle resize-w" data-dir="West"></div>
    <div class="resize-handle resize-ne" data-dir="NorthEast"></div>
    <div class="resize-handle resize-nw" data-dir="NorthWest"></div>
    <div class="resize-handle resize-se" data-dir="SouthEast"></div>
    <div class="resize-handle resize-sw" data-dir="SouthWest"></div>

    <!-- Custom Window Title Bar -->
    <div class="window-titlebar" id="titlebar">
        <div class="titlebar-left">
            <img class="titlebar-icon" id="titlebar-icon" width="18" height="18" alt="S">
            <span class="titlebar-title">Symbion Agent</span>
        </div>
        <div class="titlebar-controls">
            <button class="titlebar-btn minimize" onclick="ipcMinimize()" title="Minimiser">
                <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
            </button>
            <button class="titlebar-btn maximize" onclick="ipcMaximize()" title="Maximiser">
                <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
            </button>
            <button class="titlebar-btn close" onclick="ipcClose()" title="Fermer">
                <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.2"/></svg>
            </button>
        </div>
    </div>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <img class="header-icon" id="header-icon" width="24" height="24" alt="">
            <span class="header-logo">Symbion</span>
            <span class="header-host" id="hostname">--</span>
        </div>
        <div class="header-right">
            <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Changer le thème"></button>
            <div class="status-badge offline" id="status-badge">
                <span class="dot pulse"></span>
                <span id="status-text">--</span>
            </div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" data-tab="status">Status</div>
        <div class="tab" data-tab="agents">Agents</div>
        <div class="tab" data-tab="logs">Logs</div>
        <div class="tab" data-tab="config">Config</div>
    </div>

    <!-- Panels -->
    <div class="panels">
        <!-- Status Panel -->
        <div class="panel active" id="panel-status">
            <div id="update-section"></div>
            <div id="status-content">
                <div class="loading">Connexion...</div>
            </div>
        </div>

        <!-- Agents Panel -->
        <div class="panel" id="panel-agents">
            <div class="section-title">Cet agent</div>
            <div id="agents-content">
                <div class="loading">Chargement...</div>
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" onclick="openMainPWA()">Ouvrir PWA</button>
                <button class="btn btn-ghost" onclick="reconnect()">Reconnecter MQTT</button>
            </div>
        </div>

        <!-- Logs Panel -->
        <div class="panel" id="panel-logs">
            <div class="log-controls">
                <button class="log-filter active" data-level="all" onclick="filterLogs('all',this)">Tout</button>
                <button class="log-filter" data-level="INFO" onclick="filterLogs('INFO',this)">Info</button>
                <button class="log-filter" data-level="WARN" onclick="filterLogs('WARN',this)">Warn</button>
                <button class="log-filter" data-level="ERROR" onclick="filterLogs('ERROR',this)">Error</button>
            </div>
            <div class="log-list" id="log-list">
                <div class="loading">Chargement des logs...</div>
            </div>
        </div>

        <!-- Config Panel -->
        <div class="panel" id="panel-config">
            <div id="config-content">
                <div class="loading">Chargement...</div>
            </div>
            <div class="btn-row">
                <button class="btn btn-ghost" onclick="openConfigFile()">Ouvrir fichier config</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <span id="footer-version">Symbion Agent</span> &middot; <span id="footer-uptime">--</span>
    </div>
</div>

    // ── Theme Management ──
    function getSystemTheme() {
        return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    function getTheme() {
        return localStorage.getItem('symbion_agent_theme') || getSystemTheme();
    }
    function applyTheme(theme) {
        if (theme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }
        var btn = document.getElementById('theme-toggle');
        if (btn) btn.textContent = theme === 'light' ? '\u2600' : '\u263D';
    }
    window.toggleTheme = function() {
        var current = getTheme();
        var next = current === 'light' ? 'dark' : 'light';
        localStorage.setItem('symbion_agent_theme', next);
        applyTheme(next);
    };
    applyTheme(getTheme());
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function() {
        if (!localStorage.getItem('symbion_agent_theme')) {
            applyTheme(getSystemTheme());
        }
    });

    // ── IPC Bridge for Borderless Window Controls ──
    function ipcSend(msg) {
        if (window.ipc && window.ipc.postMessage) {
            window.ipc.postMessage(msg);
        }
    }

    window.ipcMinimize = function() { ipcSend('minimize'); };
    window.ipcMaximize = function() { ipcSend('maximize'); };
    window.ipcClose = function() { ipcSend('close'); };

    // Title bar drag
    var titlebar = document.getElementById('titlebar');
    titlebar.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        if (e.target.closest('.titlebar-controls')) return;
        ipcSend('drag');
    });

    // Double-click titlebar to toggle maximize
    titlebar.addEventListener('dblclick', function(e) {
        if (e.target.closest('.titlebar-controls')) return;
        ipcSend('maximize');
    });

    // Resize handles
    document.querySelectorAll('.resize-handle').forEach(function(handle) {
        handle.addEventListener('mousedown', function(e) {
            if (e.button !== 0) return;
            e.preventDefault();
            ipcSend('resize:' + handle.dataset.dir);
        });
    });

    // ── Tab Navigation ──
    document.querySelectorAll('.tab').forEach(function(tab) {
        tab.addEventListener('click', function() {
            document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.panel').forEach(function(p) { p.classList.remove('active'); });
            tab.classList.add('active');
            document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        });
    });

    // ── Formatters ──
    function fmtUptime(s) {
        if (!s) return '0s';
        var d = Math.floor(s / 86400);
        var h = Math.floor((s % 86400) / 3600);
        var m = Math.floor((s % 3600) / 60);
        if (d > 0) return d + 'j ' + h + 'h';
        if (h > 0) return h + 'h ' + m + 'm';
        return m + 'm ' + (s % 60) + 's';
    }

    function fmtBytes(bytes) {
        if (bytes == null) return '--';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
        return (bytes / 1073741824).toFixed(2) + ' GB';
    }

    function barClass(pct) {
        if (pct > 90) return 'crit';
        if (pct > 75) return 'warn';
        return '';
    }

    function makeBar(label, pct, baseClass) {
        var cls = barClass(pct) || baseClass;
        return '<div class="bar-container">' +
            '<div class="bar-header">' +
                '<span class="label">' + label + '</span>' +
                '<span class="value">' + pct.toFixed(1) + '%</span>' +
            '</div>' +
            '<div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + Math.min(pct, 100) + '%"></div></div>' +
        '</div>';
    }

    // ── Status Panel ──
    function renderStatus(d) {
        var sys = d.system || {};
        var cpuPct = sys.cpu_percent != null ? sys.cpu_percent : 0;
        var memPct = sys.memory_total_mb > 0 ? (sys.memory_used_mb / sys.memory_total_mb * 100) : 0;

        var html = '';
        html += makeBar('CPU', cpuPct, 'cpu');
        html += makeBar('RAM', memPct, 'mem');

        if (sys.disk_used_gb != null && sys.disk_total_gb > 0) {
            var diskPct = sys.disk_used_gb / sys.disk_total_gb * 100;
            html += makeBar('Disque', diskPct, 'disk');
        }

        if (sys.swap_used_mb != null && sys.swap_total_mb > 0) {
            var swapPct = sys.swap_used_mb / sys.swap_total_mb * 100;
            html += makeBar('Swap', swapPct, 'swap');
        }

        html += '<div class="info-grid">';
        html += infoCard('CPU', cpuPct.toFixed(1) + '%');
        html += infoCard('RAM', sys.memory_used_mb ? (sys.memory_used_mb + '/' + sys.memory_total_mb + ' MB') : '--');
        html += infoCard('Processus', sys.process_count || '--');
        html += infoCard('Load Avg', sys.load_average != null ? sys.load_average.toFixed(2) : '--');

        if (sys.temperature != null) {
            html += infoCard('Temp.', sys.temperature.toFixed(1) + ' °C');
        }
        if (sys.network_rx_bytes != null) {
            html += infoCard('Net RX', fmtBytes(sys.network_rx_bytes));
        }
        if (sys.network_tx_bytes != null) {
            html += infoCard('Net TX', fmtBytes(sys.network_tx_bytes));
        }
        if (sys.disk_used_gb != null) {
            html += infoCard('Disque', sys.disk_used_gb.toFixed(1) + '/' + (sys.disk_total_gb || 0).toFixed(0) + ' GB');
        }
        html += '</div>';

        document.getElementById('status-content').innerHTML = html;

        document.getElementById('hostname').textContent = d.hostname || '--';
        var badge = document.getElementById('status-badge');
        var stxt = document.getElementById('status-text');
        if (d.mqtt_connected) {
            badge.className = 'status-badge online';
            stxt.textContent = 'MQTT';
        } else {
            badge.className = 'status-badge offline';
            stxt.textContent = 'Offline';
        }

        document.getElementById('footer-version').textContent = 'Symbion Agent v' + (d.version || '?');
        document.getElementById('footer-uptime').textContent = fmtUptime(d.uptime_seconds);
    }

    function infoCard(label, value) {
        return '<div class="info-card"><div class="card-label">' + label + '</div><div class="card-value">' + value + '</div></div>';
    }

    // ── Agents Panel ──
    function renderAgent(d) {
        var sys = d.system || {};
        var html = '<div class="agent-card">' +
            '<div class="agent-card-header">' +
                '<span class="agent-name">' + (d.hostname || 'Unknown') + '</span>' +
                '<span class="agent-status ' + (d.mqtt_connected ? 'online' : 'offline') + '">' + (d.mqtt_connected ? 'En ligne' : 'Hors ligne') + '</span>' +
            '</div>' +
            '<div class="agent-detail">ID: ' + (d.agent_id || '--') + '</div>' +
            '<div class="agent-detail">Version: ' + (d.version || '--') + '</div>' +
            '<div class="agent-detail">Uptime: ' + fmtUptime(d.uptime_seconds) + '</div>' +
            '<div class="agent-detail">CPU: ' + (sys.cpu_percent != null ? sys.cpu_percent.toFixed(1) + '%' : '--') + ' · RAM: ' + (sys.memory_used_mb || '--') + ' MB</div>' +
        '</div>';
        document.getElementById('agents-content').innerHTML = html;
    }

    // ── Logs Panel ──
    function renderLogs(logs) {
        if (!logs || logs.length === 0) {
            document.getElementById('log-list').innerHTML = '<div class="loading">Aucun log</div>';
            return;
        }
        var list = document.getElementById('log-list');
        var html = '';
        for (var i = 0; i < logs.length; i++) {
            var log = logs[i];
            var level = log.level || 'INFO';
            if (currentFilter !== 'all' && level !== currentFilter) continue;
            var time = log.timestamp ? log.timestamp.substring(11, 19) : '--:--:--';
            html += '<div class="log-entry">' +
                '<span class="log-time">' + time + '</span>' +
                '<span class="log-level ' + level + '">' + level + '</span>' +
                '<span class="log-msg">' + escapeHtml(log.message || '') + '</span>' +
            '</div>';
        }
        list.innerHTML = html || '<div class="loading">Aucun log pour ce filtre</div>';
        if (logsAutoScroll) {
            list.scrollTop = list.scrollHeight;
        }
    }

    function escapeHtml(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    // ── Config Panel ──
    function renderConfig(d) {
        var sys = d.system || {};
        var html = '';
        html += '<div class="config-group">' +
            '<div class="config-group-title">Agent</div>' +
            '<div class="config-row"><span class="config-key">Agent ID</span><span class="config-val">' + (d.agent_id || '--') + '</span></div>' +
            '<div class="config-row"><span class="config-key">Version</span><span class="config-val">' + (d.version || '--') + '</span></div>' +
            '<div class="config-row"><span class="config-key">Hostname</span><span class="config-val">' + (d.hostname || '--') + '</span></div>' +
        '</div>';
        html += '<div class="config-group">' +
            '<div class="config-group-title">Connexion</div>' +
            '<div class="config-row"><span class="config-key">MQTT</span><span class="config-val">' + (d.mqtt_connected ? 'Connecté' : 'Déconnecté') + '</span></div>' +
            '<div class="config-row"><span class="config-key">Dernier heartbeat</span><span class="config-val">' + (d.last_heartbeat ? d.last_heartbeat.substring(11, 19) : '--') + '</span></div>' +
        '</div>';
        html += '<div class="config-group">' +
            '<div class="config-group-title">Système</div>' +
            '<div class="config-row"><span class="config-key">CPU (cores)</span><span class="config-val">' + (sys.cpu_cores || '--') + '</span></div>' +
            '<div class="config-row"><span class="config-key">RAM totale</span><span class="config-val">' + (sys.memory_total_mb ? sys.memory_total_mb + ' MB' : '--') + '</span></div>' +
            '<div class="config-row"><span class="config-key">Processus</span><span class="config-val">' + (sys.process_count || '--') + '</span></div>' +
        '</div>';
        document.getElementById('config-content').innerHTML = html;
    }

    // ── Data Fetching ──
    var lastData = null;

    async function fetchStatus() {
        try {
            var r = await fetch(API + '/status');
            if (!r.ok) throw new Error('HTTP ' + r.status);
            lastData = await r.json();
            renderStatus(lastData);
            renderAgent(lastData);
            renderConfig(lastData);
        } catch (e) {
            if (!lastData) {
                document.getElementById('status-content').innerHTML =
                    '<div class="error-state"><div class="icon">!</div><div class="msg">Connexion impossible<br><small>' + e.message + '</small></div>' +
                    '<button class="btn btn-ghost" onclick="location.reload()">Réessayer</button></div>';
            }
        }
    }

    async function fetchLogs() {
        try {
            var r = await fetch(API + '/logs');
            if (!r.ok) return;
            var data = await r.json();
            renderLogs(data.logs || []);
        } catch (e) { /* silent */ }
    }

    async function checkUpdates() {
        try {
            var r = await fetch(API + '/update/status');
            if (!r.ok) return;
            var info = await r.json();
            if (info.update_available) {
                document.getElementById('update-section').innerHTML =
                    '<div class="update-banner"><strong>Mise à jour disponible</strong> — v' + info.current_version + ' → v' + info.latest_version +
                    '<div style="margin-top:6px"><button class="btn btn-primary" onclick="installUpdate()">Installer</button></div></div>';
            }
        } catch (e) { /* silent */ }
    }

    // ── Actions ──
    window.openMainPWA = async function() {
        try { await fetch(API + '/open-dashboard', { method: 'POST' }); } catch(e) {}
        window.open('https://symbion.markcha.fr', '_blank');
    };

    window.reconnect = async function() {
        document.getElementById('status-text').textContent = '...';
        try {
            await fetch(API + '/reconnect', { method: 'POST' });
            setTimeout(fetchStatus, 2000);
        } catch (e) { /* silent */ }
    };

    window.installUpdate = async function() {
        document.getElementById('update-section').innerHTML =
            '<div class="update-banner"><strong>Installation en cours...</strong></div>';
        try {
            await fetch(API + '/update/install', { method: 'POST' });
            setTimeout(function() { location.reload(); }, 3000);
        } catch (e) {
            document.getElementById('update-section').innerHTML =
                '<div class="update-banner" style="border-color:#f38ba8"><strong>Échec de l\'installation</strong></div>';
        }
    };

    window.openConfigFile = function() {
        fetch(API + '/open-config', { method: 'POST' }).catch(function() {});
    };

    window.filterLogs = function(level, el) {
        currentFilter = level;
        document.querySelectorAll('.log-filter').forEach(function(f) { f.classList.remove('active'); });
        el.classList.add('active');
        fetchLogs();
    };

    // ── Init ──
    fetchStatus();
    checkUpdates();
    fetchLogs();

    setInterval(fetchStatus, 5000);
    setInterval(fetchLogs, 5000);
})();
</script>
</body>
</html>
