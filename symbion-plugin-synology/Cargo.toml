[package]
name = "symbion-plugin-synology"
version = "0.1.0"
edition = "2021"
authors = ["Mark Chavatte <Markchavatte@gmail.com>"]
description = "Symbion plugin for Synology NAS monitoring (UPS/NUT, system stats)"

[dependencies]
tokio = { version = "1", features = ["full", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = "0.24"
axum = "0.7"
tower = "0.4"
symbion-plugin-common = { path = "../symbion-plugin-common" }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
