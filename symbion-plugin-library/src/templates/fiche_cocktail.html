<div class="card cocktail-card" data-icon="{{icon}}">

  <div class="header">
    <div class="meta">Cocktail N°{{fiche_num}}</div>
    <div class="title">{{title}}</div>
    <div class="subtitle">{{subtitle}}</div>
    <div class="type-badge">{{type}}</div>
  </div>

  <hr class="divider">

  <div class="section-label">Base · {{base}}</div>
  <div class="ingredients-list">
    {{ingredients_display}}
  </div>

  <hr class="divider">

  <div class="section-label">Préparation</div>
  <div class="prep-text">{{preparation}}</div>

  <hr class="divider">

  <div class="section-label">Notes</div>
  <div class="notes-text">{{notes}}</div>

  <div class="footer">{{footer}}</div>

</div>
