# Configuration msmtp pour alertes Symbion
# Copier ce fichier vers ~/.msmtprc et adapter avec vos credentials

# Compte par défaut
defaults
auth           on
tls            on
tls_trust_file /etc/ssl/certs/ca-certificates.crt
logfile        ~/.msmtp.log

# Gmail
account        gmail
host           smtp.gmail.com
port           587
from           votre-email@gmail.com
user           votre-email@gmail.com
password       votre-app-password  # Générer un mot de passe d'application

# OVH
account        ovh
host           ssl0.ovh.net
port           587
from           votre-email@ovh.com
user           votre-email@ovh.com
password       votre-password

# Compte par défaut
account default : gmail

# Instructions:
# 1. Installer msmtp: sudo apt install msmtp msmtp-mta
# 2. Copier ce fichier: cp config-mail-example.conf ~/.msmtprc
# 3. Protéger le fichier: chmod 600 ~/.msmtprc
# 4. Éditer avec vos credentials
# 5. Tester: echo "Test" | msmtp votre-email@example.com
